name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded push should not keep burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The committed lockfile must keep building: this is what a contributor gets
  # from a bare `dune build`. Cold it compiles the world including OCaml
  # (~17 min); warm, the dune cache turns that into minutes. Unit tests only --
  # the opam job below owns the live-database suite.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-pkg-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}
          restore-keys: dune-pkg-${{ runner.os }}-

      - name: Install libpq headers (conf-postgresql)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dune (developer preview binary)
        run: |
          curl -fsSL https://get.dune.build/install | sh
          echo "$HOME/.dune/bin" >> "$GITHUB_PATH"

      - name: Build from dune.lock
        run: dune build

      - name: Unit tests (no database)
        run: dune test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sqlml
          POSTGRES_PASSWORD: sqlml
          POSTGRES_DB: sqlml
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sqlml -d sqlml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sqlml:sqlml@127.0.0.1:55432/sqlml

    steps:
      - uses: actions/checkout@v4

      # This job tests the opam workflow. dune switches to package management
      # whenever dune.lock is present, which would ignore the opam-installed
      # dependencies and rebuild the world uncached -- so drop the lock here.
      - name: Use the opam workflow, not the lockfile
        run: rm -rf dune.lock

      # Modular explicits landed in 5.5.0; nothing older can build this.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install --yes \
            ptime uuidm decimal yojson \
            cmdliner otoml conf-postgresql \
            caqti caqti-eio caqti-driver-postgresql eio_main \
            ocamlformat.0.29.0 odoc

      - name: Build
        run: opam exec -- dune build

      # Release isolation: only the three packages are visible, so a dependency
      # on anything unattached (example/, test-only libs) fails here, not on an
      # opam consumer's machine.
      - name: Packages build in isolation
        run: opam exec -- dune build -p sqlml,sqlml-postgresql,sqlml-caqti @install

      - name: Unit tests (no database)
        run: opam exec -- dune test

      - name: Load schema
        run: PGPASSWORD=sqlml psql -h 127.0.0.1 -p 55432 -U sqlml -d sqlml -f example/schema.sql

      - name: End-to-end (libpq driver)
        run: opam exec -- dune exec example/e2e.exe

      - name: Examples (single connection, and Caqti pool)
        run: |
          opam exec -- dune exec example/app.exe
          opam exec -- dune exec example/web.exe

      - name: Generated code is current (sqlml check)
        run: opam exec -- dune exec bin/main.exe -- check -q example/sql -o example/generated

      # Same check through the committed snapshot: DATABASE_URL is cleared so
      # this fails if --offline ever touches the network.
      - name: Generated code is current, offline (snapshot)
        run: env -u DATABASE_URL opam exec -- dune exec bin/main.exe -- check --offline -q example/sql -o example/generated

      - name: Snapshot is current
        run: |
          opam exec -- dune exec bin/main.exe -- snapshot -q example/sql
          git diff --exit-code example/sql/sqlml.snapshot.json

      - name: Formatting
        run: opam exec -- dune build @fmt

      - name: Documentation
        run: opam exec -- dune build @doc
